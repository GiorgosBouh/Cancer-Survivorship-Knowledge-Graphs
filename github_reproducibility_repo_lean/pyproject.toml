[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cskg-pipeline"
version = "0.1.0"
description = "NHANES cohort pipeline for cancer survivorship accelerometry knowledge graphs"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.3",
  "scipy>=1.16",
  "rdflib>=7.0",
  "pyshacl>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cskg-build-cohort = "cskg_pipeline.build_cohort:main"

